// Android SDK 가 있는 머신에서만 빌드에 포함된다 (settings.gradle.kts 참고).
// Groovy 로 둔 이유: SDK 가 없는 환경에서 .kts 가 AGP 타입을 못 찾아 스크립트 컴파일이 깨지기 때문.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// CI 가 넣어주는 빌드 식별자. 없으면(로컬) 1 / local 로 떨어진다.
def buildNumber = (System.getenv('SKY_TYCOON_BUILD_NUMBER') ?: '1') as Integer
def commitSha = (System.getenv('SKY_TYCOON_COMMIT') ?: 'local').take(7)

android {
    namespace = 'skytycoon.android'
    compileSdk = libs.versions.androidCompileSdk.get() as Integer

    // 폰에 이미 깔린 앱 위에 덮어 설치하려면 두 APK 의 서명이 같아야 한다. AGP 는
    // 디버그 키스토어가 없으면 그 자리에서 랜덤 키를 만들어 쓰는데, CI 러너는 매 실행이
    // 빈 홈 디렉터리라 nightly APK 마다 서명이 달라졌다 — 폰에서는 "앱이 설치되지 않음"
    // 으로만 보인다. 그래서 키스토어를 레포에 박아 어디서 빌드하든 같은 서명이 나오게 한다.
    // (디버그 전용 키다. 스토어 배포용 키가 아니므로 비밀번호가 공개되어도 무방하다.)
    signingConfigs {
        debug {
            storeFile = rootProject.file('android/debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }

    defaultConfig {
        applicationId = 'skytycoon.android'
        minSdk = libs.versions.androidMinSdk.get() as Integer
        targetSdk = libs.versions.androidTargetSdk.get() as Integer
        // versionCode 가 1 로 고정이면 폰이 어느 쪽이 새 빌드인지 알 수 없다. CI 가
        // 실행 번호를 넣어 매 빌드 올라가게 하고, 로컬 빌드는 1 로 둔다.
        versionCode = buildNumber
        versionName = "1.0.${buildNumber} (${commitSha})".toString()
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            minifyEnabled = false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation project(':app')
    implementation libs.androidx.activity.compose
}
