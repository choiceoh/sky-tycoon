name: CI

# 기준 타깃이 안드로이드 폰이므로 APK 조립까지 검증한다. 데스크톱만 컴파일하면
# settings.gradle.kts 가 SDK 부재 시 :android 를 빌드에서 빼기 때문에,
# MainActivity·매니페스트·안드로이드 세이브 구현이 한 번도 컴파일되지 않은 채
# 그린 체크로 머지될 수 있다.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # main 푸시마다 nightly 릴리스에 APK 를 갈아 끼운다

jobs:
  verify:
    name: core test + desktop compile + APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Simulation tests + UI compile
        run: ./gradlew :core:jvmTest :app:desktopTest :app:compileKotlinDesktop --no-daemon

      - name: Render screens headlessly
        run: ./gradlew :app:screenshots --no-daemon

      # ubuntu-latest 러너에는 Android SDK 가 이미 깔려 있어 ANDROID_HOME 만 있으면
      # settings.gradle.kts 가 :android 를 빌드에 넣는다.
      - name: Assemble Android APK
        env:
          # 빌드마다 versionCode 를 올려 폰이 새 빌드를 업데이트로 알아보게 한다.
          SKY_TYCOON_BUILD_NUMBER: ${{ github.run_number }}
          SKY_TYCOON_COMMIT: ${{ github.sha }}
        run: ./gradlew :android:assembleDebug --no-daemon

      # 서명이 어긋나도 빌드는 초록불로 끝난다 — 폰에 덮어 설치할 때야 "앱이 설치되지
      # 않음" 으로 드러난다. 그러니 여기서 APK 를 뜯어 지문을 대조한다.
      - name: Verify APK signing certificate
        run: python3 tools/verify_apk_signer.py android/build/outputs/apk/debug/*-debug.apk

      - name: Upload rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: app/build/screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

      # PR 에서도 받아볼 수 있게 아티팩트로 남긴다 (다운로드에 로그인이 필요하고 zip 으로 묶인다).
      - name: Upload debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-tycoon-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # 폰에서 바로 받으려면 릴리스가 낫다 — 로그인도 압축 해제도 필요 없는 고정 URL 이 생긴다.
      # main 이 갱신될 때마다 같은 `nightly` 태그를 갈아 끼우므로 링크는 변하지 않는다.
      - name: Publish APK to the rolling nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/build/outputs/apk/debug/*-debug.apk sky-tycoon-debug.apk
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly sky-tycoon-debug.apk \
            --title "최신 빌드 (nightly)" \
            --notes "main ${GITHUB_SHA:0:7} 에서 자동 빌드한 디버그 APK 입니다 (빌드 #${GITHUB_RUN_NUMBER}).

          폰에서 \`sky-tycoon-debug.apk\` 를 받아 설치하세요 (알 수 없는 출처 허용 필요).
          디버그 서명이라 Play 스토어 배포용은 아닙니다.

          설치가 '앱이 설치되지 않음' 으로 막히면 예전에 깔아둔 스카이 타이쿤을 지우고
          다시 받으세요 — 2026-08-18 이전 빌드는 서명 키가 매번 달라 덮어쓰기가 되지 않습니다
          (세이브도 함께 지워집니다). 그 이후 빌드끼리는 그냥 덮어 설치됩니다." \
            --prerelease
